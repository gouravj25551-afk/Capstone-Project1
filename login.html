<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GharSetGo - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="navbar">
    <h2>GharSetGo</h2>
    <button class="menu-toggle" aria-label="Toggle navigation">☰</button>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="properties.html">Properties</a>
      <a href="login.html">Login</a>
    </div>
  </div>

  <div class="login-box">
    <h2>Login</h2>

    <input id="emailInput" type="text" placeholder="Email or Phone">
    <input id="passwordInput" type="password" placeholder="Password">

    <button id="loginBtn" disabled>Login</button>
    <p id="emailError" class="error" style="color:#c00; font-size:0.9em; display:none; margin-top:8px;">Please enter a valid Gmail address (example@gmail.com).</p>

    <p>Don't have an account? <a href="#">Sign Up</a></p>
  </div>

  <div class="footer">
    <p>© 2025 GharSetGo | No Brokerage. No Hassle.</p>
  </div>

  <script src="script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const emailInput = document.getElementById('emailInput');
      const loginBtn = document.getElementById('loginBtn');
      const emailError = document.getElementById('emailError');

      const gmailRegex = /^[a-zA-Z0-9._%+-]+@gmail\.com$/;

      function validate() {
        const val = emailInput.value.trim();
        if (!gmailRegex.test(val)) {
          loginBtn.disabled = true;
          emailError.style.display = val === '' ? 'none' : 'block';
        } else {
          loginBtn.disabled = false;
          emailError.style.display = 'none';
        }
      }

      emailInput.addEventListener('input', validate);
      emailInput.addEventListener('blur', validate);


      loginBtn.addEventListener('click', function (e) {
        if (loginBtn.disabled) {
          e.preventDefault();
        }
      });

    
      validate();
    });
  </script>
</body>
</html>
